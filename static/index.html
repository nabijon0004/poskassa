<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f4ef">
    <title>Paprika — заказ без очереди</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <button class="brand" id="brandHome" aria-label="На главную">
          <img class="brand-logo" src="/assets/logo.jpg" alt="Логотип Paprika">
          <span class="brand-name">Paprika</span>
        </button>
        <div class="topbar-right">
          <div class="language-switch" id="languageSwitch" role="group" aria-label="Язык"></div>
        </div>
      </header>
      <div class="notice" id="notice" role="status" hidden></div>
      <main id="main"></main>
      <footer class="site-footer">
        <span id="footerMessage">Paprika Self-Service</span>
        <button class="admin-link" id="adminOpen" type="button">Для сотрудников</button>
      </footer>
    </div>
    <div id="modalRoot"></div>
    <script src="/static/i18n.js" defer></script>
    <script src="/static/app.js" defer></script>
  </body>
</html>
